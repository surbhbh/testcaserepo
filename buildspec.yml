version: 0.2
env:
  variables:
    LANG: "en_US.UTF-8"
    LC_ALL: "en_US.UTF-8"
    FL_OUTPUT_DIR: "output"
    SCAN_DEVICE: "iPhone 15 (16.4)"
cache:
  paths:
    - "DerivedData/*/"
phases:
  install:
    commands:
      - "set -eo pipefail"
      - "echo 'checking if Rosetta needs to be installed'"
      - "if [ \"$(uname -m)\" = \"arm64\" ]; then /usr/sbin/softwareupdate --install-rosetta --agree-to-license; else echo 'Rosetta 2 can only be installed on Apple Silicon!'; exit 1; fi"
  pre_build:
    commands:
      - "echo 'Current directory: $(pwd)'"
      - "echo 'Listing directory contents:'"
      - "ls -la"
      - "if [ ! -f \"Gemfile\" ]; then echo 'Error: Gemfile not found!'; exit 1; fi"
      - |
        if [ ! -f "Podfile" ]; then
          echo "platform :ios, '16.0'" > Podfile
          echo "" >> Podfile
          echo "target 'MyApp' do" >> Podfile
          echo "  use_frameworks!" >> Podfile
          echo "" >> Podfile
          echo "  # Add your pods here" >> Podfile
          echo "  # pod 'Alamofire'" >> Podfile
          echo "end" >> Podfile
        fi
      - "echo 'Check / Setup Shared DerivedData'"
      - "if [ ! -d \"DerivedData\" ]; then mkdir DerivedData; fi"
      - "echo 'setup gems and pod install'"
      - "gem install bundler"
      - "bundle install"
      - "export SSL_CERT_FILE=/etc/ssl/cert.pem"
      - "gem install cocoapods"
      - "mkdir -p fastlane"
      - |
        cat > fastlane/Fastfile << 'EOF'
        default_platform(:ios)
        platform :ios do
          desc "Build for testing"
          lane :build_for_testing do
            scan(
              scheme: "MyApp",
              clean: true,
              build_for_testing: true,
              derived_data_path: "DerivedData",
              destination: "platform=iOS Simulator,name=iPhone 15",
              xcargs: "ONLY_ACTIVE_ARCH=YES"
            )
          end
        end
        EOF
      - "echo 'Created Fastfile contains:'"
      - "cat fastlane/Fastfile"
      - "pod install || true"
      - "ls -ld DerivedData"
  build:
    commands:
      - "echo 'Build For Testing'"
      - "bundle exec fastlane build_for_testing --verbose"
      - "echo 'Checking DerivedData'"
      - "ls DerivedData"
artifacts:
  files:
    - "**/*"
  base-directory: "DerivedData"
