version: 0.2
env:
  variables:
    LANG: "en_US.UTF-8"
    LC_ALL: "en_US.UTF-8"
    FL_OUTPUT_DIR: "output"
    SCAN_DEVICE: "iPhone 15 (16.4)"
  shell: "/bin/bash --login -o pipefail"

cache:
  paths:
    - 'DerivedData/*/'

phases:
  install:
    commands:
      - echo "checking if Rosetta needs to be installed"
      - |
        #!/usr/bin/env bash
        if [ "$(uname -m)" = "arm64" ]; then
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license
        else
          echo "Rosetta 2 can only be installed on Apple Silicon!"
          exit 1
        fi
  pre_build:
    commands:
      - echo "Check / Setup Shared DerivedData"
      - if [ ! -d "DerivedData" ]; then mkdir DerivedData; fi
      - echo "setup gems and pod install"
      - bundle install
      - export SSL_CERT_FILE=/etc/ssl/cert.pem
      - pod install
      - ls -ld DerivedData
  build:
    commands:
      - echo "Build For Testing"
      - sudo bundle exec fastlane build_for_testing
      - echo "Checking DerivedData"
      - ls DerivedData

artifacts:
  files:
    - '**/*'
  base-directory: 'DerivedData'
